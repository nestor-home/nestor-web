server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    # redirects keep the visitor's scheme, host and port: Nginx listens on 8080 behind the TLS proxy
    absolute_redirect off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    gzip on;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The OAuth relay (the admin's default relay_url), at this exact URL as providers have it
    # registered: no trailing slash, the query untouched. The page sits beside relay.js, which it
    # loads relatively. It carries the authorization code in its query: no caching, no Referer.
    location = /redirect/oauth {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        try_files /redirect/oauth.html =404;
    }

    location = /redirect/oauth/ {
        return 301 /redirect/oauth$is_args$args;
    }

    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
