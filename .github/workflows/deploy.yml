# Deploys a published version again, e.g. to roll back: Actions → Deploy → Run workflow.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to deploy, e.g. 0.2.0
        required: true

permissions:
  contents: read
  packages: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.digest.outputs.image }}
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: digest
        env:
          VERSION: ${{ inputs.version }}
        run: |
          name="ghcr.io/${GITHUB_REPOSITORY,,}"
          digest=$(docker buildx imagetools inspect "$name:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)
          echo "image=$name@$digest" >> "$GITHUB_OUTPUT"

  deploy:
    needs: resolve
    uses: nestor-home/.github/.github/workflows/deploy.yml@v1
    with:
      app: nestor-web
      image: ${{ needs.resolve.outputs.image }}
      url: https://nestor.mathislambert.fr
    secrets: inherit
