name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new commit on a pull request makes its earlier run moot: it is cancelled. Runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The site is built once (build), then checked in parallel: lint, types and unit tests (check),
# the built pages in a browser in shards (e2e), what only the Nginx image does (nginx).
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # the build takes the protocol's JSON Schemas and the OAuth relay from the server package with uvx (scripts/server.mjs)
      - uses: astral-sh/setup-uv@v10.3.3
      - run: pnpm install --frozen-lockfile
      # Astro keeps the optimised images here, keyed by source and options: an image already
      # made is not made again (most of the build's time)
      - uses: actions/cache@v6
        with:
          path: node_modules/.astro
          key: astro-${{ hashFiles('pnpm-lock.yaml', 'astro.config.mjs', 'src/assets/**') }}
          restore-keys: astro-
      - run: pnpm build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 1

  e2e:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 3
    strategy:
      fail-fast: false
      matrix:
        shard: [1/4, 2/4, 3/4, 4/4]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - id: playwright
        run: echo "version=$(pnpm exec playwright --version)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: pnpm exec playwright install --only-shell chromium  # the runner image has the system libraries
      - run: pnpm e2e --shard ${{ matrix.shard }}
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-${{ strategy.job-index }}
          path: test-results/
          retention-days: 7

  # what only the site's Nginx does (deploy/nginx.conf): the OAuth relay's exact URL, redirects
  nginx:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - run: docker build -t nestor-web . && docker run -d --rm -p 8080:8080 nestor-web
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: playwright
        run: echo "version=$(pnpm exec playwright --version)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: pnpm exec playwright install --only-shell chromium  # the runner image has the system libraries
      - run: pnpm e2e e2e/nginx.spec.ts
        env:
          E2E_NGINX: "1"
          E2E_BASE: http://localhost:8080
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-nginx
          path: test-results/
          retention-days: 7

  # The single check the branch rules require.
  ci:
    needs: [check, build, e2e, nginx]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
